name: Signed release candidate
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      RUNLOCAL_STORE_PASSWORD: ${{ secrets.RUNLOCAL_STORE_PASSWORD }}
      RUNLOCAL_KEY_ALIAS: ${{ secrets.RUNLOCAL_KEY_ALIAS }}
      RUNLOCAL_KEY_PASSWORD: ${{ secrets.RUNLOCAL_KEY_PASSWORD }}
      EXPECTED_CERTIFICATE_SHA256: ${{ vars.RUNLOCAL_CERTIFICATE_SHA256 }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Restore private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RUNLOCAL_KEYSTORE_BASE64 }}
        run: |
          export RUNLOCAL_KEYSTORE="$RUNNER_TEMP/runlocal-signing.jks"
          printf 'RUNLOCAL_KEYSTORE=%s\n' "$RUNLOCAL_KEYSTORE" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          for key in ['KEYSTORE_BASE64', 'RUNLOCAL_STORE_PASSWORD', 'RUNLOCAL_KEY_ALIAS', 'RUNLOCAL_KEY_PASSWORD', 'EXPECTED_CERTIFICATE_SHA256']:
              if not os.environ.get(key):
                  raise SystemExit(f'Missing release configuration: {key}')
          path = Path(os.environ['RUNLOCAL_KEYSTORE'])
          path.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          path.chmod(0o600)
          PY
      - run: ./scripts/bootstrap-native.sh
      - run: ./gradlew :app:testReleaseUnitTest :app:assembleRelease :app:lintRelease -Prunlocal.abis=arm64-v8a -Prunlocal.repository="$RELEASE_REPOSITORY" --max-workers=2
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Verify APK and signing identity
        run: |
          python3 scripts/package_apk.py app/build/outputs/apk/release/app-arm64-v8a-release.apk --output-dir dist
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('dist/INSTALLATION-CHECKS.json').read_text())
          if report['certificateSha256'].lower() != os.environ['EXPECTED_CERTIFICATE_SHA256'].lower():
              raise SystemExit('Signing certificate changed; refusing this release.')
          PY
          python3 scripts/release_notes.py --report dist/INSTALLATION-CHECKS.json --tag "$RELEASE_TAG" --output dist/RELEASE-NOTES.md
      - name: Create reviewable GitHub draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "dist/runlocal-${RELEASE_TAG#v}-arm64.apk" dist/SHA256SUMS dist/INSTALLATION-CHECKS.json --verify-tag --draft --title "RunLocal ${RELEASE_TAG#v}" --notes-file dist/RELEASE-NOTES.md "${args[@]}"
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/runlocal-signing.jks"
